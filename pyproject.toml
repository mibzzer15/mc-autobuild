[project]
name = "mc-autobuilder"
version = "0.1.0"
description = "Automates MissionChief station management using Realism Location Marker (RLM) real-world location data."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "typer>=0.12",
    "SQLAlchemy>=2.0",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40"]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
mc-autobuilder = "mc_autobuilder.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mc_autobuilder = ["web/templates/*.html", "web/static/*"]
